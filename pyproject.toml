[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proj-3-medical-serving"
version = "0.1.0"
description = "Auditable Chinese medical adaptation and reproducible LLM serving benchmark"
requires-python = ">=3.10,<3.14"
dependencies = [
  "numpy>=1.26",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# 锁定为 omni 环境实测跑通的版本组合（2026-08，4×RTX 3090）；
# 与 requirements-*.txt 保持一致，两处需同步修改。
train = [
  "numpy==1.26.4",
  "torch==2.8.0+cu129",
  "transformers==5.15.0",
  "accelerate==1.14.0",
  "peft==0.20.0",
  "bitsandbytes==0.50.1",
  "datasets==3.6.0",
]
serve = [
  "vllm==0.27.1",
  "openai>=1.60,<2",
]
eval = [
  "scikit-learn>=1.5",
]
dev = [
  "pytest==9.1.1",
  "ruff==0.15.17",
]

[tool.setuptools]
packages = ["data", "model", "train", "eval", "serving", "optional", "optional.rlvr", "optional.custom_int8"]

[tool.ruff]
line-length = 100
target-version = "py310"

